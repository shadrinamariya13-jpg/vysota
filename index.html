<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF4ED" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Высота" />
    <title>Высота — таск-трекер</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Временный перехватчик ошибок для отладки на iOS
      window.onerror = function(msg, src, line, col, err) {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#FAF4ED;padding:20px;font-family:monospace;font-size:13px;z-index:99999;overflow:auto;';
        d.innerHTML = '<b style="color:#B8755A">Ошибка:</b><br>' + msg + '<br><br><b>Файл:</b> ' + src + '<br><b>Строка:</b> ' + line + ':' + col + (err ? '<br><br><b>Stack:</b><br>' + err.stack : '');
        document.body.appendChild(d);
      };
      window.addEventListener('unhandledrejection', function(e) {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#FAF4ED;padding:20px;font-family:monospace;font-size:13px;z-index:99999;overflow:auto;';
        d.innerHTML = '<b style="color:#B8755A">Promise ошибка:</b><br>' + (e.reason && (e.reason.message || String(e.reason)));
        document.body.appendChild(d);
      });
    </script>
  </body>
</html>
