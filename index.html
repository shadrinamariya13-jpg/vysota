<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF4ED" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Высота" />
    <title>Высота — таск-трекер</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Авто-обновление: при каждом открытии проверяем версию на сервере.
      // Если версия изменилась — сбрасываем кеш SW и перезагружаемся.
      (function() {
        var vurl = location.pathname.replace(/[^/]*$/, '') + 'version.json?t=' + Date.now();
        var stored = localStorage.getItem('vysota-version');
        fetch(vurl, { cache: 'no-store' })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            var v = data && data.v;
            if (!v) return;
            if (stored && stored !== v) {
              localStorage.setItem('vysota-version', v);
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  var ps = regs.map(function(r) { return r.unregister(); });
                  Promise.all(ps).then(function() {
                    return caches.keys();
                  }).then(function(keys) {
                    return Promise.all(keys.map(function(k) { return caches.delete(k); }));
                  }).then(function() { location.reload(); });
                });
              } else {
                location.reload();
              }
            } else {
              localStorage.setItem('vysota-version', v);
            }
          }).catch(function() {});
      })();
    </script>
  </body>
</html>
